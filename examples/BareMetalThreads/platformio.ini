; =============================================================================
; PlatformIO configuration - ArduinoThread BareMetalThreads example
; =============================================================================
;
; Unlike the BasicThreads example, this one is NOT standalone. It needs a
; CubeMX-generated project supplying the HAL, SystemClock_Config(), the GPIO
; and UART init, and the linker script. See README.md in this folder.
;
; The settings that matter for the library are:
;
;   framework = stm32cube      no Arduino layer; millis() comes from the
;                              compat header, mapped to HAL_GetTick()
;
;   -D STM32H743xx             tells gthread_compat.h which series HAL header
;                              to include. Usually already set by the board
;                              definition, listed here for clarity.
;
; Optional:
;
;   -D GTHREAD_NO_HAL          forward-declare HAL_GetTick() instead of
;                              including the full HAL header in every
;                              translation unit. Resolves at link time.
;
;   -D USE_THREAD_NAMES        enable auto-generated "Thread <id>" names
;   -D THREAD_NAME_LEN=32      buffer size for the above (default 24)
;
; To use a tick source other than HAL_GetTick(), see the note on GTHREAD_MILLIS
; in src/gthread_compat.h. It MUST be a global build flag, never a #define in
; one source file.
; =============================================================================

[env:weact_h743]
platform  = ststm32
board     = weact_mini_h743vitx
framework = stm32cube

lib_deps =
    symlink://../..

build_flags =
    -D STM32H743xx
    ; -D GTHREAD_NO_HAL
    ; -D USE_THREAD_NAMES

monitor_speed = 115200
