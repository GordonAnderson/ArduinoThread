; =============================================================================
; PlatformIO project configuration — ArduinoThread BasicThreads example
; =============================================================================
;
; Usage:
;   pio run -t upload        build and upload to the connected board
;   pio device monitor       open serial monitor at 115200 baud
;   pio run -t upload && pio device monitor   (build, upload, and monitor)
;
; Board selection:
;   Change the [env:*] section(s) below to match your hardware.
;   Common board IDs: uno, nano, megaatmega2560, leonardo, teensy41,
;                     esp32dev, esp8266, arduino_due_x
;
; Library reference:
;   The ArduinoThread library is referenced as a local path so this example
;   works directly inside the library repository.  When the library is
;   published to a registry, replace lib_deps with the registry reference:
;
;     lib_deps = ArduinoThread @ ^2.1.0          ; Arduino Library Registry
;     lib_deps = gaacustom/ArduinoThread @ ^2.1.0 ; PlatformIO Registry
;     lib_deps = https://github.com/YOUR_ORG/ArduinoThread.git
; =============================================================================

[platformio]
; Default environment to build when none is specified on the command line.
default_envs = uno

; ---------------------------------------------------------------------------
; Shared settings inherited by all environments
; ---------------------------------------------------------------------------
[env]
lib_deps =
    symlink://../..     ; resolve to the library root (two levels up from here)

monitor_speed = 115200
monitor_filters = time, colorize

; ---------------------------------------------------------------------------
; Arduino Uno / Nano (ATmega328P)
; ---------------------------------------------------------------------------
[env:uno]
platform  = atmelavr
board     = uno
framework = arduino

; ---------------------------------------------------------------------------
; Arduino Mega 2560
; ---------------------------------------------------------------------------
[env:mega]
platform  = atmelavr
board     = megaatmega2560
framework = arduino

; ---------------------------------------------------------------------------
; Teensy 4.1
; ---------------------------------------------------------------------------
[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; ---------------------------------------------------------------------------
; ESP32 (generic DevKit)
; ---------------------------------------------------------------------------
[env:esp32]
platform  = espressif32
board     = esp32dev
framework = arduino

; ---------------------------------------------------------------------------
; ESP8266 (NodeMCU 1.0)
; ---------------------------------------------------------------------------
[env:esp8266]
platform  = espressif8266
board     = nodemcuv2
framework = arduino
