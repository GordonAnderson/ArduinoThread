; =============================================================================
; PlatformIO project configuration — ArduinoThread library root
; =============================================================================
; Open the ArduinoThread/ folder in VS Code and build from here.
; Source is pulled from examples/BasicThreads/src/main.cpp.
; Library headers are resolved from src/.
; =============================================================================

[platformio]
default_envs = uno
src_dir  = examples/BasicThreads/src

[env]
lib_deps      = symlink://.
monitor_speed  = 115200
    
[env:uno]
platform  = atmelavr
board     = uno
framework = arduino

[env:mega]
platform  = atmelavr
board     = megaatmega2560
framework = arduino

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

[env:esp32]
platform  = espressif32
board     = esp32dev
framework = arduino

[env:esp8266]
platform  = espressif8266
board     = nodemcuv2
framework = arduino
